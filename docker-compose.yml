services:
  house-price-model-service:
    build:
      context: .
      dockerfile: house-price-model-service/Dockerfile
      args:
        EVALUATION_METHOD: ${EVALUATION_METHOD:-repeated-kfold}
    environment:
      BATCH_PREDICTION_LIMIT: ${BATCH_PREDICTION_LIMIT:-20}
    ports:
      - "9000:9000"
