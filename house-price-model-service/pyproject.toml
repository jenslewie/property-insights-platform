[project]
name = "house-price-model-service"
version = "1.0.0"
description = "Housing price prediction model API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "joblib>=1.6.0,<1.7",
    "pandas>=3.0.6,<4.0",
    "pydantic>=2.13.5,<2.14",
    "scikit-learn>=1.9.1,<1.10",
    "uvicorn[standard]>=0.53.0,<0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pandas-stubs>=3.0.5,<3.1",
    "pytest>=9.1.1,<9.2",
    "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
