[project]
name = "house-price-model-service"
version = "1.0.0"
description = "Housing price prediction model API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "joblib>=1.5.3,<1.6",
    "pandas>=2.3.3,<3.0",
    "pandas-stubs~=2.3.3",
    "scikit-learn>=1.8,<1.9",
    "uvicorn[standard]>=0.52.4,<0.53",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.1.1,<9.2",
    "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
